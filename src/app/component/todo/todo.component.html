<h1>Todo app with Angular & Spring</h1>
@if (loading()){
    <p> loading</p>
} @else if (error() != null){
    <p> {{error()}}</p>
} @else {

    <div class="todoContainer">
        
        <form [formGroup]="todoForm" (ngSubmit)="onSubmit()" class="todoCard">
            <h2>@if(isEditingTodo()){ Edit todo } @else { New todo }</h2>

            <label for="title">Title</label>
            <input id="title" type="text" formControlName="title">
            <label for="description">Description</label>
            <input id="description" type="text" formControlName="description">
            <button type="submit" [disabled]="!todoForm.valid" class="submitButton">
                @if(isEditingTodo()){ 
                    Update todo 
                } @else { 
                    Add todo 
                }
            </button>
        </form>

        @for (todo of todos(); track todo.id) {
            <div class="todoCard">
                <div class="cardContent">
                    <h2 class="todoTitle"> {{todo.title}}</h2>
                    <p class="todoDescription"> {{todo.description}} </p>
                </div>
                <div class="buttonsContainer">
                    <button class = "editButton" (click)="editTodo(todo)">
                        Edit
                    </button>
                    <button class = "deleteButton" (click)="deleteTodo(todo.id)" [disabled]="editingId() === todo.id">
                        Delete
                    </button>
                </div>

            </div>
        }
    </div>

}
